- name: "ICARUS_NuMI_1muNp0pi_selection"
  isEnabled: true
  selectedDataEntry: "FakeDataFromMC" # Irrelevant naming, please ignore
  showSelectedEventCount: true

  mc:
    tree: "events/full/selected"
    filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam.root"
    nominalWeightFormula: "(ppfx_cv_weight)"
  data:
    # Fake data = nominal MC reweighted by the LQCD-informed Z-expansion
    # axial form factor correction (Kiyoung's medulla fork, to_gundam.cc:
    # https://github.com/kyjung123/medulla/blob/f62fefff00b3c2e80fc9a623afa9f7f63a6d8305/systematics/src/to_gundam.cc#L218-L227
    # and #L331-L337). This dial ("GENIEReWeight_SBNNuSyst_LQCDZExpFit_
    # correction_ZExpAVariationResponse") is a "multisim" type with a single
    # meaningful universe, so rather than exporting a full TGraph response
    # for the fit to interpolate, to_gundam.cc exports just that one
    # correction weight (weights.front()) directly as a flat branch named
    # "LQCDZExpFitCorrection_weight" in the GUNDAM input tree. No manual
    # true_interaction_mode cut is needed here (unlike
    # FakeData_QE_dpTShape/FakeData_QE_ProtonP), since this is a
    # GENIEReWeight-computed physics weight, not a hand-built binned table.
    #
    # Negative-value guard: matches Kiyoung's own dataSetListConfig for this
    # dial (his 1mu1pi analysis config uses the identical
    # "WEIGHT < 0 ? 1 : WEIGHT" pattern), so the branch's fallback/error
    # sentinel is not assumed to be a safe multiplicative weight -- it is
    # replaced with 1.0 (no correction) instead of being applied as-is.
    #
    # PREREQUISITE (not yet satisfied as of this file's creation): this
    # branch does not exist in the current GUNDAM input file
    # (icarus_numi_numu_mc_onbeam_offbeam_syst_gundam.root). It requires
    # pulling Kiyoung's updated to_gundam.cc into the systematics-tree
    # generation step and regenerating the file before this study can run.
    - name: "FakeDataFromMC"
      tree: "events/full/selected"
      nominalWeightFormula: "(ppfx_cv_weight) * (LQCDZExpFitCorrection_weight < 0 ? 1 : LQCDZExpFitCorrection_weight)"
      filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam.root"

- name: "ICARUS_NuMI_1muNp0pi_sideband"
  isEnabled: true
  selectedDataEntry: "FakeDataFromMC_sideband"
  showSelectedEventCount: true

  mc:
    tree: "events/full/sideband"
    filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam.root"
    nominalWeightFormula: "(ppfx_cv_weight)"
  data:
    # data from the same MC -- same LQCD Z-exp correction reweight as above
    # (with the same negative-value guard), applied to the sideband tree.
    - name: "FakeDataFromMC_sideband"
      tree: "events/full/sideband"
      nominalWeightFormula: "(ppfx_cv_weight) * (LQCDZExpFitCorrection_weight < 0 ? 1 : LQCDZExpFitCorrection_weight)"
      filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam.root"

