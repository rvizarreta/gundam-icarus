- name: "ICARUS_NuMI_1muNp0pi_selection"
  isEnabled: true
  selectedDataEntry: "FakeDataFromMC" # Irrelevant naming, please ignore
  showSelectedEventCount: true

  mc:
    tree: "events/full/selected"
    filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"
    nominalWeightFormula: "(ppfx_cv_weight)"
  data:
    # data from the same MC, with true charged-pion interactions suppressed 20%.
    # true_no_charged_pions == 1 -> no charged pions above threshold (untouched)
    # true_no_charged_pions == 0 -> has charged pions          (scaled by 0.8)
    - name: "FakeDataFromMC"
      tree: "events/full/selected"
      nominalWeightFormula: "(ppfx_cv_weight) * (true_no_charged_pions == 0 ? 0.8 : 1.0)"
      filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"

- name: "ICARUS_NuMI_1muNp0pi_sideband"
  isEnabled: true
  selectedDataEntry: "FakeDataFromMC_sideband"
  showSelectedEventCount: true

  mc:
    tree: "events/full/sideband"
    filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"
    nominalWeightFormula: "(ppfx_cv_weight)"
  data:
    # data from the same MC
    - name: "FakeDataFromMC_sideband"
      tree: "events/full/sideband"
      nominalWeightFormula: "(ppfx_cv_weight) * (true_no_charged_pions == 0 ? 0.8 : 1.0)"
      filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"

# In-time cosmics from offbeam. Same weight on mc and data, so they cancel in
# the closure test -- the only injected difference is the pion suppression.
- name: "ICARUS_NuMI_1muNp0pi_cosmics"
  isEnabled: true
  selectedDataEntry: "FakeDataFromMC_cosmics"
  showSelectedEventCount: true

  mc:
    tree: "events/offbeam/selected"
    filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"
    nominalWeightFormula: "(1.0)"
  data:
    # No pion suppression: offbeam cosmics have no true pion content.
    - name: "FakeDataFromMC_cosmics"
      tree: "events/offbeam/selected"
      nominalWeightFormula: "(1.0)"
      filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"

- name: "ICARUS_NuMI_1muNp0pi_cosmics_sideband"
  isEnabled: true
  selectedDataEntry: "FakeDataFromMC_cosmics_sideband"
  showSelectedEventCount: true

  mc:
    tree: "events/offbeam/sideband"
    filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"
    nominalWeightFormula: "(1.0)"
  data:
    - name: "FakeDataFromMC_cosmics_sideband"
      tree: "events/offbeam/sideband"
      nominalWeightFormula: "(1.0)"
      filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"
