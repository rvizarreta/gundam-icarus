- name: "ICARUS_NuMI_1muNp0pi_selection"
  isEnabled: true
  selectedDataEntry: "FakeDataFromMC" # Irrelevant naming, please ignore
  showSelectedEventCount: true

  mc:
    tree: "events/full/selected"
    filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"
    nominalWeightFormula: "(ppfx_cv_weight)"
  data:
    # data from the same MC
    - name: "FakeDataFromMC"
      tree: "events/full/selected"
      nominalWeightFormula: "(ppfx_cv_weight) * ((true_generator_q2 < 0.0 || true_generator_q2 > 0.7 || !(category == 4 || category == 5 || category == 6 || category == 7)) ? 1.0 : (1.0 - 0.7*pow(1.0 - (-0.6*true_generator_q2*(true_generator_q2-0.7)/0.1225 + true_generator_q2*(true_generator_q2-0.35)/0.245), 2)))"
      filePathList:
      - "/exp/icarus/data/users/rvizarr/medulla/icarus_numi_numu_mc_onbeam_offbeam_syst_gundam_withPCA.root"

