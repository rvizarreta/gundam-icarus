fitSampleList:
  - name: "selection_reco_dalphaT_contained"
    isEnabled: true
    binning: "${GUNDAM_CONFIG_DIR}/binnings/binning_reco_dalphaT_deg_contained.txt"
    selectionCuts: "cut_type==1 && reco_leading_muon_containment==1"
    dataSets: ["ICARUS_NuMI_1muNp0pi_selection", "ICARUS_NuMI_1muNp0pi_cosmics"]
  - name: "selection_reco_dalphaT_exiting"
    isEnabled: true
    binning: "${GUNDAM_CONFIG_DIR}/binnings/binning_reco_dalphaT_deg_exiting.txt"
    selectionCuts: "cut_type==1 && reco_leading_muon_containment==0"
    dataSets: ["ICARUS_NuMI_1muNp0pi_selection", "ICARUS_NuMI_1muNp0pi_cosmics"]
  - name: "sideband_reco_dalphaT_contained"
    isEnabled: true
    binning: "${GUNDAM_CONFIG_DIR}/binnings/binning_reco_dalphaT_deg_sideband_contained.txt"
    selectionCuts: "cut_type==1 && reco_leading_muon_containment==1"
    dataSets: ["ICARUS_NuMI_1muNp0pi_sideband", "ICARUS_NuMI_1muNp0pi_cosmics_sideband"]
  - name: "sideband_reco_dalphaT_exiting"
    isEnabled: true
    binning: "${GUNDAM_CONFIG_DIR}/binnings/binning_reco_dalphaT_deg_sideband_exiting.txt"
    selectionCuts: "cut_type==1 && reco_leading_muon_containment==0"
    dataSets: ["ICARUS_NuMI_1muNp0pi_sideband", "ICARUS_NuMI_1muNp0pi_cosmics_sideband"]
