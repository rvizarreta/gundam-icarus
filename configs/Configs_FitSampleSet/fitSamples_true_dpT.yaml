fitSampleList:
  - name: "True_dpT_XS"
    isEnabled: true
    binning: "${GUNDAM_CONFIG_DIR}/binnings/binning_true_dpT.txt"

    selectionCuts: ""

    dataSets: ["ICARUS_NuMI_1muNp0pi_signal"]
    parameterSetName: "Template Parameter true_dpT_lp_genie"
    yAxis: "#frac{d #sigma}{d #delta p_{T}} #frac{cm^{2}}{(MeV/c)Ar}"
    normaliseParameterList:
      - name: "Constant flux"
        isEnabled: true

        meanValue: 5.251614  # (numu+numubar)/cm², POT = 1.47e20 (old), 7.17839+20 (new)
        stdDev: 1.436e+10     # 12.59% uncertainty

      - name: "Number of targets"
        meanValue: 4.721444e+30
        stdDev: 9.4281120e+27
