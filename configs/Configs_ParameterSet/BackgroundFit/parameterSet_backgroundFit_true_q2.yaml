name: BackgroundFit true_generator_q2
isEnabled: true

printDialSetsSummary: true

nominalStepSize: 0.1
useOnlyOneParameterPerEvent: true

# Gaussian prior (flat 40% uncertainty per bin, diagonal -- see
# GenerateBackgroundFitQ2Cov.C), matching Howard et al.'s first and simplest
# choice for their "BackgroundFit" template parameters on nu-CC-other events.
# Unlike the signal template parameters (TemplateParameters/parameterSet_true_dpT.yaml,
# which have no covariance and float free), these parameters compete on equal
# footing with the GENIE/Flux/Detector nuisance parameters -- otherwise a
# free-floating background parameter always absorbs the full discrepancy before
# any Gaussian-constrained dial is pulled at all, which defeats the point of
# checking whether the GENIE dials are implicated.
#
# No parameterPriorTVectorD/parameterNameTObjArray/bounds vectors are given --
# ParameterSet::defineParameters() defaults an omitted prior to 1.0 per
# parameter, and bounds fall back to the top-level parameterLimits below.
# Same minimal pattern as the existing G4/parameterSet_G4_Proton.yaml.
covarianceMatrixFilePath: "${GUNDAM_CONFIG_DIR}/Configs_ParameterSet/BackgroundFit/gundaminput_backgroundfit_true_q2.root"
covarianceMatrixTMatrixD: backgroundfit_q2_cov

dialSetDefinitions:
  - name: BackgroundFit true_generator_q2 dialSetDefinitions
    # 'applyOnDataSets' can take a list or a wildcard
    applyOnDataSets: ["*"]
    parametersBinningPath: "${GUNDAM_CONFIG_DIR}/binnings/binning_true_generator_q2.txt"
    # Same background categories targeted by the Q2 and Pion fake-data reweights
    # (Configs_DataSetList/dataSetListConfig_FakeData_Q2.yaml and
    # dataSetListConfig_FakeData_Pion.yaml): true charged-pion final states that
    # survive the 1muNp0pi selection (categories 0,1,2 are the signal topologies
    # and are explicitly excluded -- matches parameterSet_true_dpT.yaml's own
    # applyCondition on categories 0,1,2, just on the complementary categories).
    applyCondition: "([category]==4) || ([category]==5) || ([category]==6) || ([category]==7)"
    printDialsSummary: true

parameterLimits:
  minValue: 0.
  maxValue: 3.0
