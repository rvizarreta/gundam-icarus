name: G4 Piminus Fate (proton momentum, contained)
isEnabled: true

printDialSetsSummary: true

allowPca: true
useEigenDecompInFit: true
allowEigenDecompWithBounds: true

# Covariance matrix produced by calc_geant4_covariance.py from
# config_G4Piminus_leading_proton_momentum_contained.json (input: events/full/selected +
# events/full/selected_multisimTree in
# icarus_numi_numu_mc_onbeam_offbeam_syst_ppfx_G4.root, dial
# 'reinteractions_piminus_Geant4', NUniv=1000, binned in proton momentum using
# binning_reco_leading_proton_momentum_contained.txt, selected on reco_leading_muon_containment == 1).
# Same G4Reweight multisim sample as the dpT-binned G4 ParameterSets; only the
# observable this covariance is histogrammed in differs. leading_proton_momentum's
# contained/exiting split was migrated from PROTON containment to MUON containment
# (matching every other split variable), so SelectionCutExpr/applyCondition here use
# reco_leading_muon_containment, and the binning file's edges were regenerated for the
# new split (see technote chat log / proton_momentum_truth_smearing_binning.py). The
# exiting-proton case, previously dropped for lack of statistics under the old proton
# split, has plenty of statistics under the muon split and now has its own ParameterSet.
# Kiyoung's fractional multisim-universe covariance convention (see
# calc_geant4_covariance.py docstring), not yet cross-checked against what this
# ParameterSet mechanism expects -- flag back if GUNDAM wants the non-fractional Eq. 12
# covariance instead.
covarianceMatrixFilePath: "${GUNDAM_CONFIG_DIR}/Configs_ParameterSet/G4/outputs/output_CovMat_G4Piminus_leading_proton_momentum_contained.root"
covarianceMatrixTMatrixD: "G4Piminus_leading_proton_momentum_contained/G4Piminus_leading_proton_momentum_contained_covariance"

parameterLimits:
  minValue: 0
  maxValue: 30

useOnlyOneParameterPerEvent: true

dialSetDefinitions:
  - name: G4 Piminus Fate (proton momentum, contained) dialSetDefinitions
    applyOnDataSets: ["*"]
    parametersBinningPath: "${GUNDAM_CONFIG_DIR}/binnings/binning_reco_leading_proton_momentum_contained.txt"
    printDialsSummary: true
    applyCondition: "([is_nu]==1) && ([reco_leading_muon_containment]==1)"
