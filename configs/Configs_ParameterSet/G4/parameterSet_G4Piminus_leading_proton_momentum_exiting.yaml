name: G4 Piminus Fate (proton momentum, exiting)
isEnabled: true

printDialSetsSummary: true

allowPca: true
useEigenDecompInFit: true
allowEigenDecompWithBounds: true

# Covariance matrix produced by calc_geant4_covariance.py from
# config_G4Piminus_leading_proton_momentum_exiting.json (input: events/full/selected +
# events/full/selected_multisimTree in
# icarus_numi_numu_mc_onbeam_offbeam_syst_ppfx_G4.root, dial
# 'reinteractions_piminus_Geant4', NUniv=1000, binned in proton momentum using
# binning_reco_leading_proton_momentum_exiting.txt, selected on reco_leading_muon_containment == 0).
# leading_proton_momentum's contained/exiting split was migrated from PROTON containment
# to MUON containment (matching every other split variable), so SelectionCutExpr/
# applyCondition here use reco_leading_muon_containment. This exiting-muon case did not
# exist previously: under the old proton-containment split, "exiting proton" was only
# 3.3% of the selected sample and was dropped for lack of statistics; under the muon
# split, exiting-muon events are the majority of the sample and support this covariance
# without issue (see technote chat log / proton_momentum_truth_smearing_binning.py for
# the binning derivation and event counts). Kiyoung's fractional multisim-universe
# covariance convention (see calc_geant4_covariance.py docstring), not yet cross-checked
# against what this ParameterSet mechanism expects -- flag back if GUNDAM wants the
# non-fractional Eq. 12 covariance instead.
covarianceMatrixFilePath: "${GUNDAM_CONFIG_DIR}/Configs_ParameterSet/G4/outputs/output_CovMat_G4Piminus_leading_proton_momentum_exiting.root"
covarianceMatrixTMatrixD: "G4Piminus_leading_proton_momentum_exiting/G4Piminus_leading_proton_momentum_exiting_covariance"

parameterLimits:
  minValue: 0
  maxValue: 30

useOnlyOneParameterPerEvent: true

dialSetDefinitions:
  - name: G4 Piminus Fate (proton momentum, exiting) dialSetDefinitions
    applyOnDataSets: ["*"]
    parametersBinningPath: "${GUNDAM_CONFIG_DIR}/binnings/binning_reco_leading_proton_momentum_exiting.txt"
    printDialsSummary: true
    applyCondition: "([is_nu]==1) && ([reco_leading_muon_containment]==0)"
