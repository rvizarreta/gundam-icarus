name: G4 Piminus Fate (opening angle, exiting)
isEnabled: true

printDialSetsSummary: true

allowPca: true
useEigenDecompInFit: true
allowEigenDecompWithBounds: true

# Covariance matrix produced by calc_geant4_covariance.py from
# config_G4Piminus_opening_angle_exiting.json (input: events/full/selected +
# events/full/selected_multisimTree in
# icarus_numi_numu_mc_onbeam_offbeam_syst_ppfx_G4.root, dial
# 'reinteractions_piminus_Geant4', NUniv=1000, binned in opening angle using
# binning_reco_opening_angle_exiting.txt, selected on reco_leading_muon_containment == 0).
# Same G4Reweight multisim sample as the dpT-binned G4 ParameterSets; only the
# observable this covariance is histogrammed in differs. Kiyoung's fractional
# multisim-universe covariance convention (see calc_geant4_covariance.py
# docstring), not yet cross-checked against what this ParameterSet mechanism
# expects -- flag back if GUNDAM wants the non-fractional Eq. 12 covariance
# instead.
covarianceMatrixFilePath: "${GUNDAM_CONFIG_DIR}/Configs_ParameterSet/G4/outputs/output_CovMat_G4Piminus_opening_angle_exiting.root"
covarianceMatrixTMatrixD: "G4Piminus_opening_angle_exiting/G4Piminus_opening_angle_exiting_covariance"

parameterLimits:
  minValue: 0
  maxValue: 30

useOnlyOneParameterPerEvent: true

dialSetDefinitions:
  - name: G4 Piminus Fate (opening angle, exiting) dialSetDefinitions
    applyOnDataSets: ["*"]
    parametersBinningPath: "${GUNDAM_CONFIG_DIR}/binnings/binning_reco_opening_angle_exiting.txt"
    printDialsSummary: true
    applyCondition: "([is_nu]==1) && ([reco_leading_muon_containment]==0)"
