name: G4 Proton Fate (exiting)
isEnabled: true

printDialSetsSummary: true

allowPca: true
# useEigenDecompInFit: true
# allowEigenDecompWithBounds: true

covarianceMatrixFilePath: "${GUNDAM_CONFIG_DIR}/Configs_ParameterSet/G4/outputs/output_CovMat_G4Proton_exiting.root"
covarianceMatrixTMatrixD: "G4Proton_exiting/G4Proton_exiting_covariance"

# parameterLimits:
#   minValue: 0
#   maxValue: 30

useOnlyOneParameterPerEvent: true

dialSetDefinitions:
  - name: G4 Proton Fate (exiting) dialSetDefinitions
    applyOnDataSets: ["ICARUS_NuMI_1muNp0pi_selection", "ICARUS_NuMI_1muNp0pi_sideband", "ICARUS_NuMI_1muNp0pi_cosmics", "ICARUS_NuMI_1muNp0pi_cosmics_sideband"]
    parametersBinningPath: "${GUNDAM_CONFIG_DIR}/binnings/binning_reco_dpT_exiting.txt"
    printDialsSummary: true
    applyCondition: "([is_nu]==1) && ([reco_leading_muon_containment]==0)"
