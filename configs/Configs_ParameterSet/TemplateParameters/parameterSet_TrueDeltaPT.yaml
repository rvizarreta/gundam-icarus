name: Template Parameter true_dpT
isEnabled: true

printDialSetsSummary: true

nominalStepSize: 0.1
useOnlyOneParameterPerEvent: true

dialSetDefinitions:
  - name: Template Parameter true_dpT dialSetDefinitions
    # 'applyOnDataSets' can take a list or a wildcard
    applyOnDataSets: ["*"]
    parametersBinningPath: "${GUNDAM_CONFIG_DIR}/binnings/binning_TrueDeltaPT.txt"
    applyCondition: "[category] == 0 or [category] == 1 or [category] == 3 or [category] == 4"
    printDialsSummary: true

parameterLimits:
  minValue: 0.
  maxValue: 3.0
