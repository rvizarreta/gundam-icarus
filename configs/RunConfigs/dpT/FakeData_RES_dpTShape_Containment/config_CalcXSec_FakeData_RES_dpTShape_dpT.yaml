# Config for gundamCalcXsec: RES true-dpT SHAPE fake data study (GiBUU/GENIE
# shape-ratio reweight of true_interaction_mode==1 events -- see
# Configs_DataSetList/dataSetListConfig_FakeData_RES_dpTShape.yaml). Runs
# against the "True" dataset regardless of which reco-level sample split
# (combined or containment-split) produced the fit result passed in via -f --
# same pattern as config_CalcXSec_FakeData_QE_dpTShape_dpT.yaml and every
# other fake-data study's CalcXsec config (LQCD, MEC, Pion, etc.): the
# ground-truth cross section is computed from the unmodified true-level MC,
# independent of which reweight was tested, since the reweighted "expected"
# truth curve this fit result gets compared against is computed separately
# (see export_expected_fakedata_xsec.py's RES_dpTShape column), not by this
# CalcXsec step itself.

#outputFolder: "${GUNDAM_CONFIG_DIR}/output/"
minGundamVersion: 1.9.0

xsecCalcConfig:
  enableStatThrowInToys: true
  enableEventMcThrow: true

fitterEngineConfig:

  # minimizer
  minimizerConfig: "${GUNDAM_CONFIG_DIR}/Configs_Minimizer/default_minimizer.yaml"

  # likelihoodInterface
  likelihoodInterfaceConfig:

    # jointProbability
    jointProbabilityConfig:
      type: "PoissonLLH"
      #type: "BarlowLLH"

    # dataSetManager
    propagatorConfig:
      parametersManagerConfig:
        parameterSetList: "${GUNDAM_CONFIG_DIR}/Configs_ParameterSetList/parameterSetList_true_dpT.yaml"
      fitSampleSetConfig: "${GUNDAM_CONFIG_DIR}/Configs_FitSampleSet/fitSamples_true_dpT.yaml"

    dataSetList: "${GUNDAM_CONFIG_DIR}/Configs_DataSetList/dataSetListConfig_True.yaml"
      #plotGeneratorConfig: "${GUNDAM_CONFIG_DIR}/Configs_PlotGenerator/plotConfigs_TrueDeltaPT.yaml"
